<style>
:root{
  --navy:#16325c; --navy2:#2b5aa6; --gold:#ffc233; --coral:#ff7a59; --coral2:#ff9a4d;
  --ink:#2b3440; --muted:#7b8797; --chat-bg:#f5efe4; --white:#fff; --line:#ece4d6;
  --user-bubble:#d9fdd3; --green:#34b77f; --sky:#7cc4ff; --lilac:#c9a7f0;
  --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',Arial,Helvetica,sans-serif; color:var(--ink);
  min-height:100vh; display:grid; place-items:center; padding:18px;
  background:
    radial-gradient(circle at 12% 18%, #ffe3c2 0, transparent 32%),
    radial-gradient(circle at 88% 12%, #cfe6ff 0, transparent 30%),
    radial-gradient(circle at 80% 88%, #ffd9e0 0, transparent 34%),
    radial-gradient(circle at 15% 85%, #d8f3c5 0, transparent 30%),
    linear-gradient(160deg,#fdf8f0,#f3ecff);
  overflow-x:hidden;
}
.deco{position:fixed;border-radius:50%;filter:blur(2px);opacity:.55;pointer-events:none;z-index:0}
.deco.d1{width:90px;height:90px;top:8%;left:6%;background:var(--gold);animation:float 7s ease-in-out infinite}
.deco.d2{width:60px;height:60px;top:70%;left:10%;background:var(--coral);animation:float 9s ease-in-out infinite reverse}
.deco.d3{width:70px;height:70px;top:20%;right:8%;background:var(--sky);animation:float 8s ease-in-out infinite}
.deco.d4{width:46px;height:46px;bottom:10%;right:12%;background:var(--lilac);animation:float 10s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(8deg)}}

.app{
  position:relative; z-index:1;
  width:min(100%,430px); height:min(880px,calc(100vh - 36px)); min-height:600px;
  background:var(--chat-bg); border-radius:28px; overflow:hidden;
  box-shadow:0 30px 70px #16325c33, 0 4px 14px #16325c14;
  display:flex; flex-direction:column;
}
@media(max-width:520px){
  body{padding:0}
  .app{height:100dvh; min-height:100dvh; border-radius:0; box-shadow:none}
  .deco{display:none}
}

header{
  position:relative; flex:0 0 auto;
  background:linear-gradient(120deg,var(--navy),var(--navy2));
  color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px;
  box-shadow:0 2px 10px #16325c33; z-index:5;
}
header .blob{position:absolute;border-radius:50%;opacity:.25;pointer-events:none}
header .blob.b1{width:120px;height:120px;background:var(--gold);top:-50px;right:-20px}
header .blob.b2{width:80px;height:80px;background:var(--coral);bottom:-40px;left:30px}
header .blob.b3{width:50px;height:50px;background:var(--sky);top:10px;left:45%}
.back{
  position:relative; z-index:2; flex:0 0 auto; background:none; border:0; color:#fff; cursor:pointer;
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:.15s;
}
.back:hover{background:#ffffff22}
.avatar{
  position:relative; z-index:2; flex:0 0 auto; width:48px;height:48px;border-radius:50%; overflow:hidden;
  background:linear-gradient(135deg,var(--gold),var(--coral));
  display:grid;place-items:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:18px; color:#fff;
  box-shadow:0 0 0 3px #ffffff55;
}
.avatar img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.avatar:has(img){background:#fff}
.avatar:not(:has(img))::after{content:"★";position:absolute;top:-4px;right:-2px;color:var(--gold);font-size:14px;text-shadow:0 0 4px #00000040}
header > img{width:48px;height:48px;border-radius:50%;object-fit:contain;flex:0 0 auto;position:relative;z-index:2;box-shadow:0 0 0 3px #ffffff55;overflow:hidden;background:#fff}
.brand{position:relative;z-index:2;line-height:1.2;min-width:0;flex:1;margin-right:10px}
.brand strong{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:flex;align-items:center;gap:5px;font-size:11.5px;opacity:.92;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot-online{width:8px;height:8px;border-radius:50%;background:#6ff09a;box-shadow:0 0 6px #6ff09a;flex:0 0 auto}
.header-actions{position:relative;z-index:2;margin-left:auto;flex:0 0 auto;display:flex;gap:2px;align-items:center}
.icon-btn{
  background:none;border:0;color:#fff;cursor:pointer;width:38px;height:38px;flex:0 0 auto;border-radius:50%;
  display:grid;place-items:center;transition:.15s;
}
.icon-btn:hover{background:#ffffff22}

main{
  flex:1; overflow-y:auto; padding:16px 12px 10px; position:relative;
  background-image:radial-gradient(#e2d8c4 1.2px, transparent 1.2px), radial-gradient(#e2d8c4 1px, transparent 1px);
  background-size:26px 26px; background-position:0 0, 13px 13px;
  scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
}
.day{
  text-align:center; margin:4px auto 14px; width:fit-content;
  background:#fffdf8; color:var(--muted); font-size:11.5px; font-weight:700;
  padding:5px 12px; border-radius:9px; box-shadow:0 1px 3px #00000014;
}
.row{display:flex;margin:0 0 10px;animation:pop .28s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.row.user{justify-content:flex-end}
.bubble{
  position:relative; max-width:84%; padding:9px 34px 8px 12px;
  border-radius:14px; font-size:15px; line-height:1.5; font-weight:600;
  white-space:pre-line; word-wrap:break-word; box-shadow:0 1px 2px #00000012;
}
.row.bot .bubble{background:var(--white);border-bottom-left-radius:5px;color:var(--ink)}
.row.user .bubble{background:var(--user-bubble);border-bottom-right-radius:5px;color:#1f2c1a}
.row.bot .bubble::before{
  content:"";position:absolute;left:-7px;bottom:0;width:14px;height:14px;
  background:var(--white);clip-path:polygon(100% 0,100% 100%,0 100%);
  box-shadow:-1px 1px 2px #00000008;
}
.row.user .bubble::before{
  content:"";position:absolute;right:-7px;bottom:0;width:14px;height:14px;
  background:var(--user-bubble);clip-path:polygon(0 0,100% 100%,0 100%);
}
.time{
  position:absolute;right:9px;bottom:4px;font-size:10.5px;font-weight:700;
  color:#9aa3ad;letter-spacing:.2px;user-select:none;
}
.row.user .time{color:#6f8a5f}

.typing .bubble{padding:12px 16px 10px}
.tdots{display:inline-flex;gap:4px;align-items:center;height:16px}
.tdots span{width:7px;height:7px;border-radius:50%;background:#b6c0cc;animation:bounce 1.2s infinite}
.tdots span:nth-child(2){animation-delay:.15s}
.tdots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 2px 16px;animation:pop .28s ease-out}
.chip{
  border:1.5px solid #e2d8c6; background:#fffdf8; color:var(--navy);
  border-radius:999px; padding:9px 15px; font-family:'Nunito',sans-serif;
  font-size:13.5px; font-weight:800; cursor:pointer; transition:.15s;
  box-shadow:0 1px 2px #0000000a;
}
.chip:hover{border-color:var(--coral);color:var(--coral);transform:translateY(-1px);box-shadow:0 4px 10px #ff7a5922}
.chip:active{transform:scale(.97)}

.actions{display:flex;gap:9px;flex-wrap:wrap;margin:4px 2px 16px;animation:pop .28s ease-out}
.btn{
  border:0; border-radius:999px; padding:11px 18px; font-family:'Nunito',sans-serif;
  font-size:14px; font-weight:800; cursor:pointer; transition:.15s;
}
.btn.primary{
  background:linear-gradient(135deg,var(--coral2),var(--coral)); color:#fff;
  box-shadow:0 6px 16px #ff7a5944;
}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px #ff7a5955}
.btn.secondary{background:#fffdf8;color:var(--navy);border:1.5px solid var(--line)}
.btn.secondary:hover{border-color:var(--navy2)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}

form.card{
  background:#fffdf8; border-radius:20px; padding:18px 16px 14px; margin:2px 2px 16px;
  box-shadow:0 6px 20px #16325c18; display:grid; gap:12px; animation:pop .28s ease-out;
  border:1px solid var(--line);
}
form.card label{font-size:12.5px;color:var(--navy);font-weight:800;display:grid;gap:5px}
form.card input,form.card select,form.card textarea{
  width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:12px;
  font:14px 'Nunito',sans-serif; font-weight:600; background:#fff; color:var(--ink);
  transition:.15s;
}
form.card input:focus,form.card select:focus,form.card textarea:focus{
  outline:none; border-color:var(--coral); box-shadow:0 0 0 4px #ff7a5922;
}
form.card textarea{resize:vertical}
.check{display:flex!important;grid-template-columns:none!important;align-items:flex-start;gap:8px;font-weight:600!important;color:var(--muted)!important;font-size:12px!important;line-height:1.4}
.check input{width:18px!important;height:18px;margin-top:1px;accent-color:var(--coral);flex:0 0 auto}
.submit-btn{
  width:100%; border:0; border-radius:14px; padding:14px; font-family:'Fredoka',sans-serif;
  font-weight:600; font-size:15.5px; color:#fff; cursor:pointer; letter-spacing:.3px;
  background:linear-gradient(135deg,var(--coral2),var(--coral));
  box-shadow:0 6px 16px #ff7a5944; transition:.15s;
}
.submit-btn:hover{transform:translateY(-1px)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.note{font-size:11.5px;color:var(--muted);line-height:1.45;text-align:center;font-weight:600}
.error{font-size:12.5px;color:#c62828;font-weight:800;text-align:center}
.hidden{display:none!important}

.composer{
  flex:0 0 auto; display:flex; align-items:flex-end; gap:8px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom)); background:transparent;
}
.composer input{
  flex:1; border:0; border-radius:999px; padding:13px 18px; font:15px 'Nunito',sans-serif; font-weight:600;
  background:#fffdf8; box-shadow:0 2px 8px #16325c18; color:var(--ink);
}
.composer input:focus{outline:none;box-shadow:0 0 0 3px #ff7a5933, 0 2px 8px #16325c18}
.send{
  flex:0 0 auto; width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--coral2),var(--coral)); color:#fff;
  display:grid;place-items:center; box-shadow:0 6px 14px #ff7a5955; transition:.15s;
}
.send:hover{transform:scale(1.05)}
.send:active{transform:scale(.95)}

footer{
  flex:0 0 auto; text-align:center; font-size:10.5px; color:#9a8f7a; font-weight:700;
  padding:4px 10px 8px; letter-spacing:.3px;
}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="deco d1"></div><div class="deco d2"></div><div class="deco d3"></div><div class="deco d4"></div>

<div class="app">
  <header>
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <button class="back" id="backBtn" title="Voltar ao início" aria-label="Voltar ao início">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="avatar"><img src="logo-portinari.png" alt="Escola Portinari"></div>
    <div class="brand">
      <strong>Escola Portinari</strong>
      <small><span class="dot-online"></span> online • Matrículas 2027</small>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="callBtn" title="Falar no WhatsApp" aria-label="Falar no WhatsApp">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      </button>
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <div class="day">Hoje</div>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <input id="msgInput" type="text" placeholder="Digite sua mensagem..." maxlength="300" aria-label="Digite sua mensagem">
    <button class="send" type="submit" aria-label="Enviar mensagem">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>

  <footer>Escola Portinari • Juntos voamos mais alto</footer>
</div>

<script>
const CONFIG = {
  SHEETS_ENDPOINT: "https://script.google.com/macros/s/AKfycbzqzF3Y_yIyO9alL2Ca_y-9yR2DWa8R3-Y9iaexaXfUVxqrKO4OLGpW5oF70Im7hsAz/exec",
  WHATSAPP: "5573998303999",
  SCHOOL_SUMMARY: "A Escola Portinari atende a Educação Infantil e o Ensino Fundamental – Anos Iniciais (1º ao 5º ano), com uma proposta que valoriza o acolhimento, a empatia, a ética e o compromisso com a aprendizagem.",
  PEDAGOGY: "Nossa proposta pedagógica é voltada à formação integral dos alunos, estimulando o desenvolvimento do conhecimento, da criatividade, do pensamento crítico e da autonomia. Para isso, contamos com o Sistema de Ensino Pitágoras, o programa bilíngue Eduall, destinado às turmas do 1º ao 5º ano, e, a partir de 2027, com o STEP, nossa nova solução educacional que amplia as experiências de aprendizagem por meio do pensamento digital e da robótica para todas as turmas, desde o maternal 2 ao 5º ano."
};

const chat = document.getElementById("chat");
const WA_LINK = () => "https://wa.me/" + CONFIG.WHATSAPP + "?text=" + encodeURIComponent("Olá! Vim pelo pré-atendimento da Escola Portinari e gostaria de mais informações sobre 2027.");

function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function addBubble(text, who="bot"){
  const row = document.createElement("div");
  row.className = "row " + (who==="user" ? "user" : "bot");
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  const t = document.createElement("span");
  t.className = "time"; t.textContent = nowTime();
  b.appendChild(t);
  row.appendChild(b);
  chat.appendChild(row);
  scrollDown();
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "row bot typing";
  row.id = "typingRow";
  row.innerHTML = '<div class="bubble"><span class="tdots"><span></span><span></span><span></span></span></div>';
  chat.appendChild(row);
  scrollDown();
}
function hideTyping(){
  const r = document.getElementById("typingRow");
  if (r) r.remove();
}
const wait = ms => new Promise(r => setTimeout(r, ms));

async function say(text, who="bot"){
  if (who === "bot"){
    showTyping();
    await wait(650 + Math.random()*450);
    hideTyping();
  }
  addBubble(text, who);
}

function addChips(items){
  const wrap = document.createElement("div");
  wrap.className = "chips";
  items.forEach(item=>{
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = item.label;
    b.onclick = ()=>{ wrap.remove(); addBubble(item.label,"user"); item.action(); };
    wrap.appendChild(b);
  });
  chat.appendChild(wrap); scrollDown();
}
function addActions(items){
  const wrap = document.createElement("div"); wrap.className = "actions";
  items.forEach(item=>{
    const b = document.createElement("button");
    b.className = "btn " + (item.primary ? "primary" : "secondary");
    b.textContent = item.label;
    b.onclick = item.action;
    wrap.appendChild(b);
  });
  chat.appendChild(wrap); scrollDown();
}

const MENU = [
  {label:"🏫 Conhecer a escola", action:school},
  {label:"📚 Séries e etapas", action:grades},
  {label:"🎓 Proposta pedagógica", action:pedagogy},
  {label:"✏️ Matrículas 2027", action:enrollment},
  {label:"💰 Mensalidades", action:prices},
  {label:"📅 Agendar visita", action:visitForm},
  {label:"💬 Falar com a equipe", action:human}
];

async function home(){
  await say("Olá! Seja bem-vindo(a) à Escola Portinari! 🌟\n\nVou ajudar você com informações sobre nossa escola e as matrículas para 2027.\n\nComo podemos ajudar?");
  addChips(MENU);
}
async function school(){
  await say(CONFIG.SCHOOL_SUMMARY);
  await say("Quer saber mais sobre as turmas ou prefere solicitar uma visita?");
  addChips([
    {label:"Ver séries e etapas", action:grades},
    {label:"Solicitar uma visita", action:visitForm},
    {label:"⬅ Voltar ao menu", action:home}
  ]);
}
async function grades(){
  await say("Atendemos as seguintes etapas:\n\n• Educação Infantil: Maternal 1, Maternal 2, Maternal 3, Nível 1 e Nível 2.\n• Ensino Fundamental – Anos Iniciais: 1º, 2º, 3º, 4º e 5º ano.\n\nA disponibilidade de vagas para 2027 precisa ser confirmada pela equipe.");
  addChips([
    {label:"Consultar uma turma", action:gradeForm},
    {label:"Solicitar uma visita", action:visitForm},
    {label:"⬅ Voltar ao menu", action:home}
  ]);
}
async function pedagogy(){
  await say(CONFIG.PEDAGOGY);
  await say("Uma visita é a melhor oportunidade para conhecer de perto nossa estrutura e conversar com a equipe pedagógica.");
  addChips([
    {label:"Agendar uma visita", action:visitForm},
    {label:"⬅ Voltar ao menu", action:home}
  ]);
}
async function enrollment(){
  await say("As matrículas para o ano letivo de 2027 são realizadas conforme a disponibilidade de vagas em cada turma.\n\nPodemos identificar a série pretendida e encaminhar seu interesse à nossa equipe.");
  addChips([
    {label:"Tenho interesse em uma vaga", action:gradeForm},
    {label:"Solicitar uma visita", action:visitForm},
    {label:"⬅ Voltar ao menu", action:home}
  ]);
}
async function prices(){
  await say("Os valores podem variar conforme a etapa de ensino e as condições aplicáveis. Para evitar passar uma informação desatualizada, nossa equipe confirma os valores e as condições diretamente com cada família.");
  addChips([
    {label:"Quero receber os valores", action:gradeForm},
    {label:"Solicitar uma visita", action:visitForm},
    {label:"Falar com a equipe", action:human},
    {label:"⬅ Voltar ao menu", action:home}
  ]);
}
async function human(){
  await say("Você pode continuar o atendimento diretamente com nossa equipe pelo WhatsApp. 💬");
  addActions([
    {label:"Abrir WhatsApp", primary:true, action:()=>{
      if (typeof fbq === "function") fbq('track', 'Lead', { content_name: 'falar_com_escola' });
      window.open(WA_LINK(),"_blank");
    }},
    {label:"Voltar ao menu", action:home}
  ]);
}
async function gradeForm(){
  await say("Vamos identificar o que sua família procura. Preencha os dados abaixo e nossa equipe poderá orientar sobre a turma e a disponibilidade.");
  showForm(false);
}
async function visitForm(){
  await say("Será um prazer receber sua família na Portinari! 🎈 Preencha os dados para solicitar uma visita. A equipe entrará em contato para confirmar o melhor horário.");
  showForm(true);
}

function showForm(isVisit){
  const form = document.createElement("form");
  form.className = "card";
  form.innerHTML = `
    <label>Nome do responsável *<input name="responsavel" required maxlength="100" autocomplete="name"></label>
    <label>WhatsApp com DDD *<input name="whatsapp" required inputmode="tel" placeholder="(73) 99999-9999" maxlength="20"></label>
    <label>Nome da criança<input name="crianca" maxlength="100"></label>
    <label>Idade da criança *<select name="idade" required><option value="">Selecione</option>${Array.from({length:18},(_,i)=>`<option>${i+1} ${i===0?"ano":"anos"}</option>`).join("")}<option>Menos de 1 ano</option></select></label>
    <label>Série pretendida *<select name="serie" required><option value="">Selecione</option><option>Maternal 1</option><option>Maternal 2</option><option>Maternal 3</option><option>Nível 1</option><option>Nível 2</option><option>1º ano</option><option>2º ano</option><option>3º ano</option><option>4º ano</option><option>5º ano</option><option>Ainda não sei</option></select></label>
    <label>Período de preferência<select name="periodo"><option value="">Não tenho preferência / quero saber as opções</option><option>Matutino</option><option>Vespertino</option><option>Integral</option></select></label>
    ${isVisit?'<label>Melhor dia para visita<input name="dia_visita" placeholder="Ex.: segunda ou quarta-feira"></label><label>Melhor horário<input name="horario_visita" placeholder="Ex.: pela manhã, às 9h"></label>':''}
    <label>Observação (opcional)<textarea name="observacao" rows="2" maxlength="500" placeholder="Há alguma informação que gostaria de compartilhar?"></textarea></label>
    <div style="position:absolute;left:-9999px" aria-hidden="true"><label>Não preencher<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <label class="check"><input type="checkbox" name="consentimento" value="Sim" required> Autorizo a Escola Portinari a utilizar estes dados exclusivamente para contato sobre o interesse informado, conforme a LGPD.</label>
    <div class="error hidden" id="formError"></div>
    <button class="submit-btn" type="submit">${isVisit?"Enviar solicitação de visita ✨":"Enviar meus dados ✨"}</button>
    <div class="note">Seus dados serão usados apenas para este atendimento e não serão compartilhados com terceiros.</div>`;

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const errorBox = form.querySelector("#formError");
    errorBox.classList.add("hidden");

    if (form.website.value.trim() !== "") return; // honeypot

    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Enviando...";

    const data = new FormData(form);
    data.append("ano_letivo","2027");
    data.append("origem","Chatbot - Link");
    data.append("tipo_solicitacao", isVisit ? "Solicitação de visita" : "Interesse em matrícula");

    if (CONFIG.SHEETS_ENDPOINT.includes("COLE_AQUI")) {
      form.remove();
      await say("O formulário está pronto, mas ainda precisamos conectar a planilha Google antes de receber solicitações. Por enquanto, fale com nossa equipe pelo WhatsApp.");
      addActions([{label:"Abrir WhatsApp", primary:true, action:()=>{
        if (typeof fbq === "function") fbq('track', 'Lead', { content_name: 'falar_com_escola' });
        window.open(WA_LINK(),"_blank");
      }}]);
      return;
    }

    try {
      await fetch(CONFIG.SHEETS_ENDPOINT, { method:"POST", body:data, mode:"no-cors" });
      if (typeof fbq === "function") {
        fbq('track', 'Lead', { content_name: isVisit ? 'agendamento_visita' : 'interesse_matricula' });
      }
      form.remove();
      await say("Recebemos sua solicitação! 🎉 Nossa equipe entrará em contato pelo WhatsApp para dar continuidade ao atendimento e, se for o caso, confirmar a visita.");
      addActions([{label:"Voltar ao menu inicial", primary:true, action:home},{label:"Falar com a equipe", action:human}]);
    } catch (err) {
      btn.disabled = false; btn.textContent = isVisit ? "Enviar solicitação de visita ✨" : "Enviar meus dados ✨";
      errorBox.textContent = "Não foi possível enviar agora. Verifique sua conexão e tente novamente, ou fale com a equipe pelo WhatsApp.";
      errorBox.classList.remove("hidden");
    }
  });
  chat.appendChild(form); scrollDown();
}

document.getElementById("composer").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addBubble(text, "user");
  await say("Obrigado pela sua mensagem! 😊 Para eu te ajudar com a informação certinha, escolha uma das opções abaixo — ou fale direto com nossa equipe no WhatsApp.");
  addChips(MENU);
});

document.getElementById("backBtn").addEventListener("click", ()=>{ addBubble("Voltar ao início","user"); home(); });
document.getElementById("callBtn").addEventListener("click", ()=>{
  if (typeof fbq === "function") fbq('track', 'Lead', { content_name: 'falar_com_escola' });
  window.open(WA_LINK(),"_blank");
});

home();
</script>
</body>
</html>
