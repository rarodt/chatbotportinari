<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento | Escola Portinari</title>
<style>
:root{
  --navy:#1a2b63;
  --red:#e2574c;
  --yellow:#f4c430;
  --green:#6fa287;
  --orange:#f0932b;
  --ink:#1f2a44;
  --muted:#6b7589;
  --line:#e3e0d3;
  --cream:#f7f3e8;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#f7f3e8 0%,#eef3e6 55%,#e3efe3 100%);font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:18px}

.app{width:min(100%,520px);height:min(850px,calc(100vh - 36px));min-height:620px;background:#fff;border-radius:28px;box-shadow:0 25px 60px rgba(26,43,99,0.18);display:flex;flex-direction:column;overflow:hidden;border:1px solid #fff}

header{background:var(--navy);color:white;padding:20px 20px 22px;display:flex;align-items:center;gap:13px;position:relative;overflow:hidden}
header::before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:var(--green);opacity:.35;top:-30px;right:40px}
header::after{content:"";position:absolute;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:26px solid var(--yellow);opacity:.55;bottom:-6px;right:-4px;transform:rotate(12deg)}
.logo{width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,0.25);position:relative;z-index:1;flex-shrink:0}
.brand{position:relative;z-index:1}
.brand strong{display:block;font-size:17px;font-family:Georgia,'Times New Roman',serif;font-style:italic;letter-spacing:.3px}
.brand small{opacity:.85;font-size:11.5px}
.status{margin-left:auto;font-size:11px;background:rgba(255,255,255,0.15);padding:7px 11px;border-radius:20px;display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow)}

main{padding:22px 20px;overflow-y:auto;flex:1;background:#fff;scrollbar-width:thin;scrollbar-color:#dcd6c4 transparent}
main::-webkit-scrollbar{width:6px}
main::-webkit-scrollbar-thumb{background:#dcd6c4;border-radius:10px}

.bubble{max-width:90%;padding:13px 16px;border-radius:4px 16px 16px 16px;background:#f7f3e8;line-height:1.5;font-size:14.5px;margin:0 0 14px;white-space:pre-line;box-shadow:0 2px 6px rgba(26,43,99,0.06);position:relative;border-left:4px solid var(--green)}
.bubble.user{margin-left:auto;margin-right:0;background:#fdece9;border-radius:16px 4px 16px 16px;border-left:0;border-right:4px solid var(--red)}

.options{display:grid;gap:10px;margin:6px 0 20px}
.option{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:14px;padding:13px 16px;text-align:left;font-size:14.5px;font-weight:700;cursor:pointer;transition:0.18s;box-shadow:0 1px 3px rgba(26,43,99,0.05)}
.option:hover{border-color:var(--red);background:#fff7f3;transform:translateX(3px);color:var(--red)}

form{display:grid;gap:13px;margin:6px 0 18px}
label{font-size:12.5px;color:var(--muted);font-weight:700;display:grid;gap:6px}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;font:14px Arial;background:#fbfbf7;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);background:#fff;box-shadow:0 0 0 4px rgba(226,87,76,0.12)}

.primary{border:0;background:linear-gradient(135deg,var(--red),#c7453b);color:white;border-radius:14px;padding:14px 16px;font-size:14.5px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(226,87,76,0.35)}
.primary:disabled{opacity:.6;cursor:not-allowed}
.secondary{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:14px;padding:12px 15px;font-weight:700;cursor:pointer}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0 18px}

footer{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center;background:#fafaf6}
.note{font-size:11px;color:var(--muted);line-height:1.4}
.hidden{display:none!important}
.error{font-size:12px;color:#b3261e;font-weight:700;background:#fdecea;padding:8px 11px;border-radius:9px}
@media(max-width:560px){body{padding:0}.app{height:100vh;min-height:100vh;border-radius:0}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo"><img src="logo-portinari.png" alt="Logo Escola Portinari" style="width:100%;height:100%;object-fit:contain;border-radius:50%"></div>
  <div class="brand"><strong>Escola Portinari</strong><small>Pre-atendimento - Matriculas 2027</small></div>
  <div class="status"><span class="dot"></span>Online</div>
</header>
<main id="chat" aria-live="polite"></main>
<footer>Escola Portinari - Juntos voamos mais alto</footer>
</div>
<script>
const CONFIG = {
  SHEETS_ENDPOINT: "https://script.google.com/macros/s/AKfycbwUjyobC3WWwgTYuRsjjpjZgjuw661oHMWHmxAC9J52Los9ba3GmQBz-VH3sDZSnIKT/exec",
  WHATSAPP: "5573998303999",
  SCHOOL_SUMMARY: "A Escola Portinari atende a Educacao Infantil e o Ensino Fundamental - Anos Iniciais (1o ao 5o ano), com uma proposta que valoriza o acolhimento, a empatia, a etica e o compromisso com a aprendizagem.",
  PEDAGOGY: "Nossa proposta pedagogica e voltada a formacao integral dos alunos, estimulando o desenvolvimento do conhecimento, da criatividade, do pensamento critico e da autonomia. Para isso, contamos com o Sistema de Ensino Pitagoras, o programa bilingue Eduall, destinado as turmas do 1o ao 5o ano, e, a partir de 2027, com o STEP, nossa nova solucao educacional que amplia as experiencias de aprendizagem por meio do pensamento digital e da robotica para todas as turmas, desde o maternal 2 ao 5o ano."
};

const chat = document.getElementById("chat");

function addBubble(text, who) {
  if (who === undefined) who = "bot";
  var div = document.createElement("div");
  div.className = "bubble" + (who === "user" ? " user" : "");
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addOptions(items) {
  var wrap = document.createElement("div");
  wrap.className = "options";
  items.forEach(function (item) {
    var b = document.createElement("button");
    b.className = "option";
    b.type = "button";
    b.textContent = item.label;
    b.onclick = function () {
      wrap.remove();
      addBubble(item.label, "user");
      item.action();
    };
    wrap.appendChild(b);
  });
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function addActions(items) {
  var wrap = document.createElement("div");
  wrap.className = "actions";
  items.forEach(function (item) {
    var b = document.createElement("button");
    b.className = item.primary ? "primary" : "secondary";
    b.textContent = item.label;
    b.onclick = item.action;
    wrap.appendChild(b);
  });
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function home() {
  addBubble("Ola! Seja bem-vindo(a) a Escola Portinari!\n\nVou ajudar voce com informacoes sobre nossa escola e as matriculas para 2027.\n\nComo podemos ajudar?");
  addOptions([
    { label: "Conhecer a escola", action: school },
    { label: "Series e etapas de ensino", action: grades },
    { label: "Proposta pedagogica", action: pedagogy },
    { label: "Matriculas 2027", action: enrollment },
    { label: "Mensalidades e valores", action: prices },
    { label: "Solicitar uma visita", action: visitForm },
    { label: "Falar com a equipe", action: human }
  ]);
}

function school() {
  addBubble(CONFIG.SCHOOL_SUMMARY);
  addBubble("Quer saber mais sobre as turmas ou prefere solicitar uma visita?");
  addOptions([
    { label: "Ver series e etapas", action: grades },
    { label: "Solicitar uma visita", action: visitForm },
    { label: "Voltar ao menu", action: home }
  ]);
}

function grades() {
  addBubble("Atendemos as seguintes etapas:\n\n- Educacao Infantil: Maternal 1, Maternal 2, Maternal 3, Nivel 1 e Nivel 2.\n- Ensino Fundamental - Anos Iniciais: 1o, 2o, 3o, 4o e 5o ano.\n\nA disponibilidade de vagas para 2027 precisa ser confirmada pela equipe.");
  addOptions([
    { label: "Consultar uma turma", action: gradeForm },
    { label: "Solicitar uma visita", action: visitForm },
    { label: "Voltar ao menu", action: home }
  ]);
}

function pedagogy() {
  addBubble(CONFIG.PEDAGOGY);
  addBubble("Uma visita e a melhor oportunidade para conhecer de perto nossa estrutura e conversar com a equipe pedagogica.");
  addOptions([
    { label: "Agendar uma visita", action: visitForm },
    { label: "Voltar ao menu", action: home }
  ]);
}

function enrollment() {
  addBubble("As matriculas para o ano letivo de 2027 sao realizadas conforme a disponibilidade de vagas em cada turma.\n\nPodemos identificar a serie pretendida e encaminhar seu interesse a nossa equipe.");
  addOptions([
    { label: "Tenho interesse em uma vaga", action: gradeForm },
    { label: "Solicitar uma visita", action: visitForm },
    { label: "Voltar ao menu", action: home }
  ]);
}

function prices() {
  addBubble("Os valores podem variar conforme a etapa de ensino e as condicoes aplicaveis. Para evitar passar uma informacao desatualizada, nossa equipe confirma os valores e as condicoes diretamente com cada familia.");
  addOptions([
    { label: "Quero receber os valores", action: gradeForm },
    { label: "Solicitar uma visita", action: visitForm },
    { label: "Falar com a equipe", action: human },
    { label: "Voltar ao menu", action: home }
  ]);
}

function human() {
  addBubble("Voce pode continuar o atendimento diretamente com nossa equipe pelo WhatsApp.");
  addActions([
    {
      label: "Abrir WhatsApp",
      primary: true,
      action: function () {
        window.open("https://wa.me/" + CONFIG.WHATSAPP + "?text=" + encodeURIComponent("Ola! Vim pelo pre-atendimento da Escola Portinari e gostaria de mais informacoes sobre 2027."), "_blank");
      }
    },
    { label: "Voltar ao menu", action: home }
  ]);
}

function gradeForm() {
  addBubble("Vamos identificar o que sua familia procura. Preencha os dados abaixo e nossa equipe podera orientar sobre a turma e a disponibilidade.");
  showForm(false);
}

function visitForm() {
  addBubble("Sera um prazer receber sua familia na Portinari! Preencha os dados para solicitar uma visita. A equipe entrara em contato para confirmar o melhor horario.");
  showForm(true);
}

function buildIdadeOptions() {
  var html = "<option value=''>Selecione</option>";
  for (var i = 1; i <= 18; i++) {
    html += "<option>" + i + (i === 1 ? " ano" : " anos") + "</option>";
  }
  html += "<option>Menos de 1 ano</option>";
  return html;
}

function showForm(isVisit) {
  var form = document.createElement("form");

  var visitFields = "";
  if (isVisit) {
    visitFields =
      "<label>Melhor dia para visita<input name='dia_visita' placeholder='Ex.: segunda ou quarta-feira'></label>" +
      "<label>Melhor horario<input name='horario_visita' placeholder='Ex.: pela manha, as 9h'></label>";
  }

  form.innerHTML =
    "<label>Nome do responsavel *<input name='responsavel' required maxlength='100' autocomplete='name'></label>" +
    "<label>WhatsApp com DDD *<input name='whatsapp' required inputmode='tel' placeholder='(73) 99999-9999' maxlength='20'></label>" +
    "<label>Nome da crianca<input name='crianca' maxlength='100'></label>" +
    "<label>Idade da crianca *<select name='idade' required>" + buildIdadeOptions() + "</select></label>" +
    "<label>Serie pretendida *<select name='serie' required>" +
      "<option value=''>Selecione</option>" +
      "<option>Maternal 1</option><option>Maternal 2</option><option>Maternal 3</option>" +
      "<option>Nivel 1</option><option>Nivel 2</option>" +
      "<option>1o ano</option><option>2o ano</option><option>3o ano</option><option>4o ano</option><option>5o ano</option>" +
      "<option>Ainda nao sei</option>" +
    "</select></label>" +
    "<label>Periodo de preferencia<select name='periodo'>" +
      "<option value=''>Nao tenho preferencia / quero saber as opcoes</option>" +
      "<option>Matutino</option><option>Vespertino</option><option>Integral</option>" +
    "</select></label>" +
    visitFields +
    "<label>Observacao (opcional)<textarea name='observacao' rows='2' maxlength='500' placeholder='Ha alguma informacao que gostaria de compartilhar?'></textarea></label>" +
    "<div style='position:absolute;left:-9999px' aria-hidden='true'><label>Nao preencher<input name='website' tabindex='-1' autocomplete='off'></label></div>" +
    "<label style='display:flex;align-items:start;font-weight:400'><input type='checkbox' name='consentimento' value='Sim' required style='width:16px;margin:1px 8px 0 0'> Autorizo a Escola Portinari a utilizar estes dados exclusivamente para contato sobre o interesse informado, conforme a LGPD.</label>" +
    "<div class='error hidden' id='formError'></div>" +
    "<button class='primary' type='submit'>" + (isVisit ? "Enviar solicitacao de visita" : "Enviar meus dados") + "</button>" +
    "<div class='note'>Seus dados serao usados apenas para este atendimento e nao serao compartilhados com terceiros.</div>";

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var errorBox = form.querySelector("#formError");
    errorBox.classList.add("hidden");

    if (form.website.value.trim() !== "") return;

    var btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    btn.textContent = "Enviando...";

    var data = new FormData(form);
    data.append("ano_letivo", "2027");
    data.append("origem", "Chatbot - Link");
    data.append("tipo_solicitacao", isVisit ? "Solicitacao de visita" : "Interesse em matricula");

    if (CONFIG.SHEETS_ENDPOINT.indexOf("COLE_AQUI") !== -1) {
      form.remove();
      addBubble("O formulario esta pronto, mas ainda precisamos conectar a planilha Google antes de receber solicitacoes. Por enquanto, fale com nossa equipe pelo WhatsApp.");
      addActions([{ label: "Abrir WhatsApp", primary: true, action: function () { human(); } }]);
      return;
    }

    fetch(CONFIG.SHEETS_ENDPOINT, { method: "POST", body: data, mode: "no-cors" })
      .then(function () {
        form.remove();
        addBubble("Recebemos sua solicitacao! Nossa equipe entrara em contato pelo WhatsApp para dar continuidade ao atendimento e, se for o caso, confirmar a visita.");
        addActions([
          { label: "Voltar ao menu inicial", primary: true, action: home },
          { label: "Falar com a equipe", action: human }
        ]);
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = isVisit ? "Enviar solicitacao de visita" : "Enviar meus dados";
        errorBox.textContent = "Nao foi possivel enviar agora. Verifique sua conexao e tente novamente, ou fale com a equipe pelo WhatsApp.";
        errorBox.classList.remove("hidden");
      });
  });

  chat.appendChild(form);
  chat.scrollTop = chat.scrollHeight;
}

home();
</script>
</body>
</html>
